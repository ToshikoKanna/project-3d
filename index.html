<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prototype Produk 3D</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      font-family: sans-serif;
      background: #0f2545;
    }

    model-viewer {
      flex: 1;
      width: 100%;
      min-height: 0;
      background-color: #0f2545;
    }

    .buttons {
      padding: 15px;
      text-align: center;
      background: #f2f2f2;
    }

    button {
      padding: 10px 20px;
      margin: 5px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: #fff;
      cursor: pointer;
    }

    button:hover { background: #555; }
  </style>
</head>
<body>

  <model-viewer id="viewer"
    src="Sapi IFLC.glb"
    alt="Produk 3D"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    environment-image="neutral"
    ar>
  </model-viewer>

  <div class="buttons">
    <button onclick="ganti('Sapi IFLC.glb')">Cow Necklace</button>
    <button onclick="ganti('kalung.glb')">Details of the Cow Necklace</button>
    <button onclick="ganti('AyamKaki.glb')">Chicken leg ring</button>
    <button onclick="ganti('Ayam.glb')">Chicken Biometric Module</button>
    <button onclick="ganti('kandang.glb')">Farm</button>

  </div>

  <script>
    function ganti(file) {
      document.getElementById('viewer').src = file;
    }
  </script>
</body>
</html>
